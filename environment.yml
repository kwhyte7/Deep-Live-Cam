name: deepfake
channels:
  - pytorch
  - conda-forge
  - nvidia
  - defaults

dependencies:
  # Base packages
  - python=3.10
  - pip
  
  # CUDA toolkit (compatible with TensorFlow 2.13)
  - cudatoolkit=11.8
  - cudnn=8.9
  
  # Core dependencies (from conda-forge)
  - numpy>=1.23.5,<2
  - typing-extensions>=4.8.0
  - psutil=5.9.8
  - pillow=10.1.0
  - protobuf=3.20.3  # Downgraded to avoid conflicts
  
  # GUI packages
  - tk
  - pip:
    - customtkinter==5.2.2
  
  # OpenCV with CUDA support (build from conda-forge)
  - opencv=4.10.0
  
  # ONNX ecosystem (use newer version to avoid protobuf conflicts)
  - onnx=1.15.0
  - onnxruntime-gpu=1.16.3
  
  # TensorFlow with GPU support
  - tensorflow=2.13.0
  
  # Remaining packages via pip
  - pip:
    # Camera and image processing
    - opencv-python==4.10.0.84
    - cv2_enumerate_cameras==1.1.15
    - pygrabber
    
    # Face recognition
    - insightface==0.7.3
    
    # Content filtering
    - opennsfw2==0.10.2
    
    # Optional: Additional tensorflow packages
    - tensorflow-addons
