name: deep-live-cam

services:
  main:
    container_name: deep-live-cam-container
    build: .
    working_dir: /app/
    volumes:
      - .:/app/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/app/models
      - ~/.Xauthority:/root/.Xauthority
      - ./faces/:/app/faces
      - ./.insightface/models:/root/.insightface/models
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    command: python3 run.py --execution-provider cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]
    environment:
      - XAUTHORITY=/mnt/c/Users/YourUser/.Xauthority
      - DISPLAY=:0
      #depends_on:
    #  - cuda
    #  - python

