name: deep-live-cam

services:
  main:
    container_name: deep-live-cam-container
    build: .
    working_dir: /app/
    volumes:
      - .:/app/
      - /dev/video0:/dev/video0
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./models:/app/models
    command: python3 run.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]
